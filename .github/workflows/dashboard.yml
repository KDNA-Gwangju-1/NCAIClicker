name: Publish project dashboard

on:
  issues:
    types: [opened, closed, reopened, edited, assigned, unassigned, labeled, unlabeled]
  # 보드에서 카드를 드래그해 Status 만 바꾸면 이슈 이벤트가 발생하지 않는다.
  # 그래서 아래 세 가지를 함께 건다.
  push:
    # 기능 작업은 Develop 으로 모인다. main 만 걸어두면 이 트리거가 사실상 죽는다.
    branches: [main, Develop]
  schedule:
    # GitHub 의 예약 실행은 부하에 따라 자주 지연되거나 건너뛴다. 정시성을 기대하지 말 것.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency parser
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build dashboard HTML
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/build_dashboard.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
