name: Debug project token

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh api graphql -f query='
          query {
            organization(login: "KDNA-Gwangju-1") {
              projectV2(number: 2) { title id }
            }
          }' || true
